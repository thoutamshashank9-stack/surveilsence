alerts:
  dwell_no_checkout:
    cooldown_seconds: 300
    enabled: true
    severity: warning
    threshold_seconds: 120
  intrusion:
    cooldown_seconds: 300
    enabled: true
    severity: critical
    zones: []
  line_crossing:
    cooldown_seconds: 10
    enabled: true
    lines: []
    severity: info
  loitering:
    cooldown_seconds: 300
    enabled: true
    severity: warning
    threshold_seconds: 60
    zones: []
analytics:
  aggregation_interval_minutes: 60
  heatmap_resolution:
  - 64
  - 48
  retention_days: 90
app:
  debug: true
  name: Edge AI CCTV Analytics
  version: 0.1.0
behavioral:
  concealment:
    enabled: true
    proximity_threshold: 0.3
  sweethearting:
    bagging_zone: bagging_area
    conveyor_zone: conveyor_belt
    enabled: true
    time_threshold: 3.0
  unusual_activity:
    crowd_min_count: 4
    crowd_radius_m: 2.0
    enabled: true
    flow_direction_deg: null
    running_threshold_mps: 2.5
  velocity_loitering:
    dwell_threshold_seconds: 30.0
    enabled: true
    velocity_threshold_mps: 0.2
cameras: []
database:
  echo: false
  url: sqlite+aiosqlite:///./data/events.db
inference:
  backend: auto
  detection:
    confidence_threshold: 0.3
    input_size:
    - 384
    - 384
    model: rfdetr_nano
    model_path: models/registry/detection/rfdetr_nano.onnx
  tracking:
    algorithm: bytetrack
    frame_rate: 30
    lost_track_buffer: 30
    minimum_consecutive_frames: 1
    minimum_matching_threshold: 0.8
    track_activation_threshold: 0.25
logging:
  file: data/system.log
  format: console
  level: INFO
notifications:
  email:
    enabled: false
    smtp_host: ''
    smtp_port: 587
  telegram:
    bot_token: ''
    chat_id: ''
    enabled: false
  whatsapp:
    account_sid: ''
    auth_token: ''
    enabled: false
    from_number: ''
    instance_id: ''
    provider: twilio
    to_number: ''
    token: ''
vlm:
  backend: simulated
  enabled: false
  endpoint: http://localhost:11434
  model: moondream2
  timeout_seconds: 10
