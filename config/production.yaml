# ============================================
# Production Configuration
# ============================================

app:
  name: "Edge AI CCTV Analytics"
  version: "0.1.0"
  debug: false

# Camera Sources (real camera streams configured via Settings UI or declared here)
cameras: []
# - id: phone_cam
#   name: Mobile Phone Stream
#   source: http://192.168.1.100:8080/video
#   type: http
#   enabled: true
# - id: rtsp_cam
#   name: IP Camera
#   source: rtsp://admin:password@192.168.1.64:554/stream1
#   type: rtsp
#   enabled: true

# Inference Settings
inference:
  backend: "auto"
  detection:
    model: "rtdetrv2_r18"
    model_path: "models/registry/detection/rtdetrv2_r18vd.onnx"
    confidence_threshold: 0.40
    input_size: [640, 640]
    classes:
      - 0   # person
      - 2   # vehicle
      - 80  # fire
      - 81  # smoke
      - 82  # weapon
    max_detections: 100
  tracking:
    algorithm: "bytetrack"
    track_activation_threshold: 0.25
    lost_track_buffer: 30
    minimum_matching_threshold: 0.8
    frame_rate: 30
    minimum_consecutive_frames: 2

# Alert Rules
alerts:
  intrusion:
    enabled: true
    zones: []
    cooldown_seconds: 120
    severity: "critical"
  loitering:
    enabled: true
    threshold_seconds: 60
    zones: []
    cooldown_seconds: 180
    severity: "warning"
  line_crossing:
    enabled: true
    lines: []
    cooldown_seconds: 10
    severity: "info"
  dwell_no_checkout:
    enabled: true
    threshold_seconds: 120
    cooldown_seconds: 180
    severity: "warning"

# Behavioral Rules
behavioral:
  unusual_activity:
    enabled: true
    running_threshold_mps: 2.5
    crowd_min_count: 4
    crowd_radius_m: 2.0
    flow_direction_deg: null
  velocity_loitering:
    enabled: true
    dwell_threshold_seconds: 30.0
    velocity_threshold_mps: 0.2
  sweethearting:
    enabled: false
    time_threshold: 3.0
  concealment:
    enabled: false
    proximity_threshold: 0.3

# Analytics
analytics:
  heatmap_resolution: [64, 48]
  aggregation_interval_minutes: 60
  retention_days: 90

# Database
database:
  url: "sqlite+aiosqlite:///./data/events.db"
  echo: false

# Notifications
notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
  whatsapp:
    enabled: false
    provider: "twilio"
    account_sid: ""
    auth_token: ""
    from_number: ""
    to_number: ""
    instance_id: ""
    token: ""

# Logging
logging:
  level: "WARNING"
  format: "json"
  file: "data/system.log"

# VLM (Visual Language Model)
vlm:
  enabled: true
  backend: "ollama"                # simulated | moondream2 | paligemma | ollama
  model: "moondream2"
  endpoint: "http://localhost:11434"
  timeout_seconds: 10
